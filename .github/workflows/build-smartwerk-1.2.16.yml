name: Build SmartWerk Theme 1.2.16

on:
  push:
    branches:
      - smartwerk-theme-1.2.16-seo
    paths:
      - 'wordpress-theme/smartwerk-1.2.16/**'
      - '.github/workflows/build-smartwerk-1.2.16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate theme
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/smartwerk-1.2.16"
          test -f "$THEME/style.css"
          test -f "$THEME/functions.php"
          test -f "$THEME/woocommerce.php"
          test -f "$THEME/assets/js/theme.js"
          grep -q "Version: 1.2.16" "$THEME/style.css"
          grep -q "woocommerce_structured_data_product" "$THEME/functions.php"
          grep -q "smartwerk_fallback_meta_tags" "$THEME/functions.php"
          grep -q "wp_sitemaps_enabled" "$THEME/functions.php"
          grep -q "woocommerce_breadcrumb" "$THEME/woocommerce.php"
      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-theme/smartwerk-1.2.16 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        shell: bash
        run: node --check wordpress-theme/smartwerk-1.2.16/assets/js/theme.js
      - name: Package theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress-theme
          zip -r ../dist/smartwerk-theme-1.2.16.zip smartwerk-1.2.16 -x '*.DS_Store'
          cd ..
          unzip -t dist/smartwerk-theme-1.2.16.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smartwerk-theme-1.2.16
          path: dist/smartwerk-theme-1.2.16.zip
          if-no-files-found: error
          retention-days: 30
