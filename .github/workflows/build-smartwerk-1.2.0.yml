name: Build SmartWerk Theme 1.2.0

on:
  push:
    branches:
      - smartwerk-theme-1.2.0-audit
    paths:
      - 'wordpress-theme/smartwerk-1.2.0/**'
      - '.github/workflows/build-smartwerk-1.2.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required theme files
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/smartwerk-1.2.0"
          test -f "$THEME/style.css"
          test -f "$THEME/index.php"
          test -f "$THEME/functions.php"
          test -f "$THEME/header.php"
          test -f "$THEME/footer.php"
          test -f "$THEME/page.php"
          test -f "$THEME/front-page.php"
          test -f "$THEME/woocommerce.php"
          test -f "$THEME/theme.json"
          test -f "$THEME/assets/js/theme.js"
          grep -q "Version: 1.2.0" "$THEME/style.css"
          grep -q "SMARTWERK 1.2.0 MIGRATION BRIDGE" "$THEME/style.css"
          grep -q "smartwerk_page_layout_mode" "$THEME/functions.php"

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-theme/smartwerk-1.2.0 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        shell: bash
        run: node --check wordpress-theme/smartwerk-1.2.0/assets/js/theme.js

      - name: Package installable WordPress theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress-theme
          zip -r ../dist/smartwerk-theme-1.2.0.zip smartwerk-1.2.0 -x '*.DS_Store'
          cd ..
          unzip -t dist/smartwerk-theme-1.2.0.zip

      - name: Upload validated theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smartwerk-theme-1.2.0
          path: dist/smartwerk-theme-1.2.0.zip
          if-no-files-found: error
          retention-days: 30
