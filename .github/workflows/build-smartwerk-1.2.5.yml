name: Build SmartWerk Theme 1.2.5

on:
  push:
    branches:
      - smartwerk-theme-1.2.5-performance
    paths:
      - 'wordpress-theme/smartwerk-1.2.5/**'
      - '.github/workflows/build-smartwerk-1.2.5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate theme
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/smartwerk-1.2.5"
          test -f "$THEME/style.css"
          test -f "$THEME/index.php"
          test -f "$THEME/functions.php"
          test -f "$THEME/header.php"
          test -f "$THEME/footer.php"
          test -f "$THEME/assets/js/theme.js"
          grep -q "Version: 1.2.5" "$THEME/style.css"
          grep -q "smartwerk_frontpage_asset_cleanup" "$THEME/functions.php"
          grep -q "smartwerk_async_font_stylesheet" "$THEME/functions.php"
          grep -q "requestIdleCallback" "$THEME/assets/js/theme.js"
          ! grep -q "@import url('https://fonts.googleapis.com" "$THEME/style.css"

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-theme/smartwerk-1.2.5 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        shell: bash
        run: node --check wordpress-theme/smartwerk-1.2.5/assets/js/theme.js

      - name: Package theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress-theme
          zip -r ../dist/smartwerk-theme-1.2.5.zip smartwerk-1.2.5 -x '*.DS_Store'
          cd ..
          unzip -t dist/smartwerk-theme-1.2.5.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smartwerk-theme-1.2.5
          path: dist/smartwerk-theme-1.2.5.zip
          if-no-files-found: error
          retention-days: 30
